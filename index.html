<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

        // ===== GAME LOOP =====
        const updateGame = () => {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            snake.unshift(head);

            // eating and growing
            if(head.x === food.x && head.y === food.y) {
                score++
                food.x = Math.floor(Math.random() * 21)
                food.y = Math.floor(Math.random() * 21)

            } else {
                snake.pop();
            }
        };
        
        setInterval(() => {
            updateGame();
            drawGame();
        }, 100);

        // ===== KEYBOARD CONTROLS =====
        window.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") {
                if (direction.y ==! 1) {
                direction = { x: 0, y: -1 }
                console.log("up")
                }
            } else if (event.key === "ArrowRight") {
                if (direction.x ==! -1) {
                direction = { x: 1, y: 0 }
                console.log("right")
                }
            } else if (event.key === "ArrowDown") {
                if (direction.y ==! -1) {
                direction = { x: 0, y: 1 }
                console.log("down")
                }
            } else if (event.key === "ArrowLeft") {
                if (direction.x ==! 1) {
                direction = { x: -1, y: 0}
                console.log("left")
                }
            }
        });
    

    </script>

</body>
</html>
